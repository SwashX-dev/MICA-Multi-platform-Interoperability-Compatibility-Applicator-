# Release builds of `mica` for every platform the install scripts serve,
# with SHA256SUMS. Pull requests build everything (so the release pipeline is
# tested before it is needed); only a pushed `v*` tag publishes, as a draft
# release for a maintainer to review and publish.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (static, musl)
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          bash .github/scripts/install-rust.sh --target ${{ matrix.arch }}-unknown-linux-musl
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Build
        run: |
          target=${{ matrix.arch }}-unknown-linux-musl
          cargo build --locked --release -p mica-cli --target "$target"
          mkdir -p dist stage
          cp "target/$target/release/mica" LICENSE README.md stage/
          tar -czf "dist/mica-$target.tar.gz" -C stage mica LICENSE README.md
          # The Debian and RPM packages carry the same static binary.
          cargo deb --no-build -p mica-cli --target "$target" --output dist/
          cargo generate-rpm -p crates/mica-cli --target "$target" --output dist/
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/install-rust.sh --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Build both architectures and join them
        run: |
          cargo build --locked --release -p mica-cli --target aarch64-apple-darwin
          cargo build --locked --release -p mica-cli --target x86_64-apple-darwin
          mkdir -p dist stage
          lipo -create -output stage/mica target/aarch64-apple-darwin/release/mica target/x86_64-apple-darwin/release/mica
          lipo -info stage/mica
          cp LICENSE README.md stage/
          stage/mica --version
          tar -czf dist/mica-universal-apple-darwin.tar.gz -C stage mica LICENSE README.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/install-rust.sh --target ${{ matrix.arch }}-pc-windows-msvc
      - name: Build
        run: |
          target=${{ matrix.arch }}-pc-windows-msvc
          cargo build --locked --release -p mica-cli --target "$target"
          mkdir -p dist stage
          cp "target/$target/release/mica.exe" LICENSE README.md stage/
          (cd stage && 7z a "../dist/mica-$target.zip" mica.exe LICENSE README.md)
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist

  checksums:
    name: SHA256SUMS
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist

  publish:
    name: Draft the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "MICA $GITHUB_REF_NAME" --notes "See docs/VALIDATION.md for what this release was tested on."
