[workspace]
resolver = "3"
members = [
    "crates/host",
    "examples/moving-square",
    # The compatibility engine: everything behind the `mica` command.
    "crates/mica-inspect",
    "crates/mica-probe",
    "crates/mica-security",
    "crates/mica-compat",
    "crates/mica-runtime",
    "crates/mica-engine",
    "crates/mica-cli",
]
default-members = ["crates/host"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/SwashX-dev/MICA-Multi-platform-Interoperability-Compatibility-Applicator-"
publish = false

# Versions shared by the compatibility-engine crates. Portable Host keeps its
# own dependency list in crates/host.
[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.1.6"
mica-inspect = { path = "crates/mica-inspect" }
mica-probe = { path = "crates/mica-probe" }
mica-security = { path = "crates/mica-security" }
mica-compat = { path = "crates/mica-compat" }
mica-runtime = { path = "crates/mica-runtime" }
mica-engine = { path = "crates/mica-engine" }

# Application components build with `--profile guest`: small, and a panic is a
# trap rather than an unwind.
[profile.guest]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
