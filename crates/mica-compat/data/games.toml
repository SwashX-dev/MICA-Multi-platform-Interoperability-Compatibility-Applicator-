# MICA compatibility database: per-game results.
#
# status (what has been demonstrated):
#   verified-playable     reproduced end to end, by a direct test MICA can
#                         repeat; for multiplayer games protected by
#                         anti-cheat, that means completing a protected online
#                         session, not just reaching the menu
#   partially-functional  runs, with documented limits
#   unverified            nobody has demonstrated it either way
#   blocked-by-anti-cheat the anti-cheat refuses this route
#   blocked-by-publisher  the publisher does not offer or forbids this route
#   unsupported           cannot work on this route for technical reasons
#
# authorization (what the publisher permits): see anticheat.toml.
#
# evidence kinds: official (publisher or platform statement), direct-test (a
# reproducible test, with its environment), community (reports MICA could
# not confirm). The loader rejects a verified-playable status without a
# direct test, and a protected multiplayer game without a multiplayer test.

schema = 1
updated = "2026-10-25"

[[game]]
id = "fortnite"
name = "Fortnite"
aliases = ["fortnite battle royale"]
publisher = "Epic Games"
anticheat = ["easy-anti-cheat"]
multiplayer = true
executables = ["FortniteClient-Win64-Shipping.exe", "FortniteClient-Win64-Shipping_EAC_EOS.exe", "FortniteLauncher.exe", "FortniteBootstrapper.exe"]
stores = { epic = "Fortnite" }
eac_linux_v2 = "pilot"
notes = [
  "Epic plans to pilot EAC Linux v2 in Fortnite and to bring Fortnite to Linux through the Epic Games Launcher once EAC Linux v2 works with a critical mass of distributions. No date has been announced.",
  "The Epic Games Launcher Preview runs natively on Linux (x64, AppImage or .deb; Ubuntu 22.04+, Fedora 43+, Debian 12+ officially) since 2026-10-14.",
]

[game.routes.windows-native]
status = "unverified"
authorization = "authorized"
summary = "Fortnite's supported PC platform."
evidence = [{ kind = "official", url = "https://www.epicgames.com/help/c-34254770/c-38015632/can-i-run-fortnite-on-windows-parallels-or-other-non-native-operating-systems-on-pc-a25107496", date = "2026-10-25", summary = "Epic lists Windows system requirements and cloud alternatives." }]

[game.routes.linux-native]
status = "blocked-by-publisher"
authorization = "planned"
summary = "Epic says Fortnite will come to Linux through the Epic Games Launcher once EAC Linux v2 works with a critical mass of distribution maintainers; no date has been announced."
evidence = [
  { kind = "official", url = "https://www.epicgames.com/help/c-34254770/c-33726977/can-i-play-fortnite-on-linux-a22610900", date = "2026-10-25", summary = "\"No, Fortnite isn't available on Linux yet.\"" },
  { kind = "official", url = "https://store.epicgames.com/news/epic-games-launcher-preview", date = "2026-10-14", summary = "Fortnite is coming to Linux on the Launcher; no date." },
  { kind = "official", url = "https://onlineservices.epicgames.com/news/introducing-easy-anti-cheat-linux-v2", date = "2026-10-14", summary = "EAC Linux v2 requirements; pilot in Fortnite." },
]
issues = ["Requires EAC Linux v2, which Epic has not released to players."]

[game.routes.linux-proton]
status = "blocked-by-anti-cheat"
authorization = "forbidden"
summary = "Epic has not enabled Easy Anti-Cheat for Wine/Proton in Fortnite, which is why Fortnite is not on Linux today; Epic's announced path is a Linux release with EAC Linux v2, not Proton."
evidence = [{ kind = "official", url = "https://onlineservices.epicgames.com/news/introducing-easy-anti-cheat-linux-v2", date = "2026-10-14", summary = "Wine/Proton support is opt-in per game, and many games have not opted in; \"This is why Fortnite isn't available on Linux yet\"." }]

[game.routes.linux-vm]
status = "blocked-by-publisher"
authorization = "forbidden"
summary = "Fortnite does not run in virtual machines."
evidence = [{ kind = "official", url = "https://www.epicgames.com/help/c-34254770/c-38015632/can-i-run-fortnite-on-windows-parallels-or-other-non-native-operating-systems-on-pc-a25107496", date = "2026-10-25", summary = "\"The game is not supported and cannot run on non-native operating systems, such as Windows Parallels installed on Mac or Linux devices, Virtual machines, or any other non-natively installed OS.\"" }]

[game.routes.macos-vm]
status = "blocked-by-publisher"
authorization = "forbidden"
summary = "Windows in Parallels or another virtual machine is not supported."
evidence = [{ kind = "official", url = "https://www.epicgames.com/help/c-34254770/c-38015632/can-i-run-fortnite-on-windows-parallels-or-other-non-native-operating-systems-on-pc-a25107496", date = "2026-10-25", summary = "Parallels and virtual machines are named explicitly." }]

[game.routes.cloud]
status = "unverified"
authorization = "authorized"
summary = "Epic points players who cannot run Fortnite natively to GeForce NOW, Amazon Luna, and Xbox Cloud Gaming. This is remote play on another computer, not local compatibility."
providers = ["GeForce NOW", "Amazon Luna", "Xbox Cloud Gaming"]
evidence = [{ kind = "official", url = "https://www.epicgames.com/help/c-34254770/c-38015632/can-i-run-fortnite-on-windows-parallels-or-other-non-native-operating-systems-on-pc-a25107496", date = "2026-10-25", summary = "Links to GeForce NOW, Amazon Luna, and Xbox Cloud Gaming." }]

