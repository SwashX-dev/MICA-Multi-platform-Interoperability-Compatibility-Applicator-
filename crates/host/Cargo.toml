[package]
name = "portable-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Native host for portable:platform application components"

[features]
default = ["sdl"]
# The graphical backend. Without it the host is headless only, which is how the
# ARM64 cross build is made (a cross-built SDL3 is not in the binary cache).
sdl = ["dep:sdl3"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.1"
sdl3 = { version = "0.20.0", optional = true }
# Only what the host needs: compile with Cranelift, run components, and print
# readable wasm backtraces. No WASI, no async, no compilation cache.
wasmtime = { version = "50.0.0", default-features = false, features = [
    "anyhow",
    "component-model",
    "cranelift",
    "demangle",
    "runtime",
    "std",
] }

[dev-dependencies]
wat = "1.262.0"
wit-component = "0.262.0"
wit-parser = "0.262.0"
